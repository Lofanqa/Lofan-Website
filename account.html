<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Account | Lofan Home Accessories</title>
<meta name="robots" content="noindex">
<link rel="icon" href="images/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="chrome"></div>
<main class="section page-narrow">
  <p class="eyebrow center">Welcome</p>
  <h2 class="center" id="hello">My <em>account</em></h2>
  <div class="tabs" id="acctTabs">
    <button data-tab="orders" class="on">My Orders</button>
    <button data-tab="profile">My Details</button>
    <button id="logoutBtn">Log Out</button>
  </div>
  <section id="tab-orders"><div id="orderList"><p class="center muted">Loading…</p></div></section>
  <section id="tab-profile" hidden>
    <div class="co-grid">
      <form id="profileForm" class="co-col" novalidate>
        <h3>Personal details</h3>
        <label>Full name<input name="name" required></label>
        <div class="row">
          <label>Mobile number<input name="phone" inputmode="tel" required></label>
          <label>Email<input type="email" name="email" required></label>
        </div>
        <label>Delivery address<textarea name="address" rows="3"></textarea></label>
        <button class="btn" type="submit">Save Details</button><p class="note" id="profileNote"></p>
      </form>
      <form id="pwForm" class="co-col" novalidate>
        <h3>Change password</h3>
        <label>Current password<input type="password" name="current" autocomplete="current-password" required></label>
        <label>New password<input type="password" name="new" autocomplete="new-password" required>
          <ul class="pw-rules" data-pw-rules aria-live="polite"><li data-r="len">8 or more characters</li><li data-r="letter">a letter</li><li data-r="num">a number</li></ul></label>
        <button class="btn" type="submit">Update Password</button><p class="note" id="pwNote"></p>
      </form>
    </div>
    <div class="loc-card" id="locCard"></div>
  </section>
</main>
<footer class="footer">
  <p>Timeless details for a more beautiful home.</p>
  <small>&copy; <span id="year"></span> Lofan Development &amp; Trading. All rights reserved.</small>
</footer>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/account.js"></script>
</body>
</html>
